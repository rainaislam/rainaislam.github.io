<div class="content-section" id="skills">
    <h2>Skills</h2>

    <div class="skills-grid">
    </div>

    <script>
      fetch('./data/skill.yml')
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.text();
              })
              .then(data => {
                  const yml = jsyaml.load(data);
                  console.log('Loaded skills:', yml.skills);
                  if (yml.skills && yml.skills.length > 0) {
                      yml.skills.forEach(renderSkill);
                  } else {
                      document.querySelector('.skills-grid').innerHTML = '<p>No skills found.</p>';
                  }
              })
              .catch(error => {
                  console.error('Error loading skills:', error);
                  document.querySelector('.skills-grid').innerHTML = '<p>Error loading skills. Please check the console for details.</p>';
              });

      function renderSkill(skillItem, idx) {
        // Extract category and skills from the skill item
        const category = Object.keys(skillItem)[0];
        const skills = skillItem[category];
        
        // Convert skills string to array if it contains commas
        const skillsList = skills.split(',').map(skill => skill.trim());
        
        document.querySelector('.skills-grid')
            .innerHTML +=
            `<div class="skill-category">
              <h4>${category}</h4>
              <ul>
                ${skillsList.map(skill => `<li>${skill}</li>`).join('')}
              </ul>
            </div>`;
      }

    </script>
  </div>
