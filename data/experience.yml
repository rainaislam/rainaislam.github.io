         <strong>Related project:</strong> Investigating the relationship between vitamin D status, genetic variation, and cardiovascular health in the Bangladeshi population through clinical, biochemical, molecular, and computational approaches.
        highlights:
           - Measured plasma vitamin D levels using HPLC
           - Extracted DNA from blood samples, performed PCR amplification, primer design and optimization, and PCR-RFLP genotyping
