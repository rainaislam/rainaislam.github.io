  bio: |
    I am a Master's student in Biochemistry and Molecular Biology at DU, with a strong passion for Molecular Biology, Bioinformatics and its application in cancer research. My interest in these fields developed during my undergraduate studies, where I completed online courses in oncology and worked on a project focused on challenges in prostate cancer diagnosis.
    I also learned essential coding languages for Bioinformatics, including Python, R, and also learned SPSS for statistical analysis.I also completed an internship on Molecular Biology which strengthened my interest in this field. A "Basic Bioinformatics" course further solidified my desire to merge my interests in Cancer and Bioinformatics, leading me to pursue a PhD in any of these fields. My skills in coding, cancer biology, molecular biology have prepared me to make a significant contribution to this field, and I am actively seeking PhD opportunities to further develop my skills and advance personalized cancer treatments through Bioinformatics, Molecular biology or other fields of biomedical sciences.