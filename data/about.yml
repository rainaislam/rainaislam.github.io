  bio: |
    I am Raina Islam, a graduate of Biochemistry and Molecular Biology from the University of Dhaka, where I am currently pursuing my Master’s degree. My research centers on the intersection of nutrition, genetics, and disease, with my thesis investigating the role of vitamin D deficiency and gene polymorphisms in acute myocardial infarction among the Bangladeshi population.I bring hands-on experience in molecular and biochemical techniques—including DNA/RNA extraction, PCR, RT-qPCR, and HPLC—as well as bioinformatics approaches such as SNP analysis, molecular docking, and RNA-seq data interpretation. I am deeply interested in advancing life science research by integrating molecular biology, computational biology, and clinical insights to better understand human health and disease.
