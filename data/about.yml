  bio: |
    I am Raina Islam, a recent graduate in Biochemistry and Molecular Biology from the University of Dhaka, Bangladesh. I completed my master’s thesis in the Laboratory of Nutrition and Health, where my research focused on the intersection of human genetics and disease. Specifically, I investigated the association between genetic polymorphisms and essential hypertension in the Bangladeshi population.
    
    My research experience combines molecular biology, biochemistry, and computational approaches. I have hands-on experience with techniques including DNA and RNA extraction, PCR, RT-qPCR, HPLC, and Sanger sequencing, along with bioinformatics approaches such as in silico SNP analysis, molecular docking, and RNA-seq data interpretation.
    
    My broader research interests lie at the intersection of biochemistry, molecular biology, computational biology, and human health. I am particularly interested in integrating experimental and computational approaches to investigate the molecular and genetic mechanisms underlying disease and to translate biological insights into a better understanding of human health. Through doctoral studies, I hope to contribute to interdisciplinary research that advances understanding of complex disease.


