<div class="container" id="awards">
    <h3>Awards</h3>

    <ul class="awards-list">
    </ul>

    <script>
      fetch('./data/awards.yml')
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.text();
              })
              .then(data => {
                  const yml = jsyaml.load(data);
                  console.log('Loaded awards:', yml.awards);
                  if (yml.awards && yml.awards.length > 0) {
                      yml.awards.forEach(renderAward);
                  } else {
                      document.querySelector('.awards-list').innerHTML = '<li>No awards found.</li>';
                  }
              })
              .catch(error => {
                  console.error('Error loading awards:', error);
                  document.querySelector('.awards-list').innerHTML = '<li>Error loading awards. Please check the console for details.</li>';
              });

      function renderAward(award, idx) {
        document.querySelector('.awards-list')
            .innerHTML +=
            `<li class="mb-4">
              <div class="col-lg-12">
                <h5><strong>${award.title}</strong></h5>
                <strong>Issuer:</strong> ${award.issuer}<br>
                ${award.description}
              </div>
            </li>`;
      }

    </script>
  </div>
