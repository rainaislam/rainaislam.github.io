<div class="content-section" id="awards">
    <h2>Awards</h2>

    <div class="awards-container">
    </div>

    <script>
      fetch('./data/awards.yml')
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.text();
              })
              .then(data => {
                  const yml = jsyaml.load(data);
                  console.log('Loaded awards:', yml.awards);
                  if (yml.awards && yml.awards.length > 0) {
                      yml.awards.forEach(renderAward);
                  } else {
                      document.querySelector('.awards-container').innerHTML = '<p>No awards found.</p>';
                  }
              })
              .catch(error => {
                  console.error('Error loading awards:', error);
                  document.querySelector('.awards-container').innerHTML = '<p>Error loading awards. Please check the console for details.</p>';
              });

      function renderAward(award, idx) {
        const date = award.date ? `<div class="item-date">${award.date}</div>` : '';
        
        document.querySelector('.awards-container')
            .innerHTML +=
            `<div class="award-item">
              <div class="item-title">${award.title}</div>
              <div class="item-institution">${award.issuer}</div>
              ${date}
              <div class="item-description">${award.description}</div>
            </div>`;
      }

    </script>
  </div>
