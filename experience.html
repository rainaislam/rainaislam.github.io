
<div class="content-section" id="experience">
    <h2>Research Experiences</h2>

    <div class="experiences-container">
    </div>

    <script>
      fetch('./data/experience.yml')
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.text();
              })
              .then(data => {
                  const yml = jsyaml.load(data);
                  console.log('Loaded experiences:', yml.experiences);
                  if (yml.experiences && yml.experiences.length > 0) {
                      yml.experiences.forEach(renderXP);
                  } else {
                      document.querySelector('.experiences-container').innerHTML = '<p>No experiences found.</p>';
                  }
              })
              .catch(error => {
                  console.error('Error loading experiences:', error);
                  document.querySelector('.experiences-container').innerHTML = '<p>Error loading experiences. Please check the console for details.</p>';
              });

      function renderXP(xp, idx) {
      const highlights = xp.highlights ? `<div class="item-highlights"><ul>${xp.highlights.map(highlight => `<li>${highlight}</li>`).join('')}</ul></div>` : '';
      const supervisor = xp.supervisor ? `<div class="item-supervisor"><strong>Supervisor:</strong> ${xp.supervisor}</div>` : '';
      
      document.querySelector('.experiences-container')
          .innerHTML +=
          `<div class="experience-item">
              <div class="item-title">${xp.title}</div>
              <div class="item-institution">${xp.institution}</div>
              <div class="item-duration">${xp.duration}</div>
              ${supervisor}
              <div class="item-description">${xp.description}</div>
              ${highlights}
          </div>`;
      }

    </script>
  </div>
