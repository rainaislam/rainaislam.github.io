  <script>
    // Load about information from YAML file
    fetch('./data/about.yml')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.text();
      })
      .then(data => {
        const yml = jsyaml.load(data);
        console.log('Loaded about data:', yml.about);
        if (yml.about) {
          renderAbout(yml.about);
        }
      })
      .catch(error => {
        console.error('Error loading about data:', error);
        // Fallback content in case of error
        document.getElementById('about-info').innerHTML = '<p>Error loading profile information.</p>';
      });

    function renderAbout(about) {
      // Set profile image
      document.getElementById('profile-image').src = about.profile_image;
      
      // Set author name in sidebar
      document.getElementById('author-name').textContent = 'Raina Islam';
      
      // Set position in sidebar
      document.getElementById('author-position').textContent = about.position;
      
      // Set position title in main content
      document.getElementById('position-title').textContent = about.position;
      
      // Set institution information
      document.getElementById('institution-info').innerHTML = `
        <a href="${about.department_url}">${about.department}</a><br/>
        <a href="${about.university_url}">${about.university}</a> - ${about.location}
      `;
      
      // Set research interests
      document.getElementById('research-interests-text').textContent = about.research_interests;
      
      // Set bio text
      document.getElementById('bio-text').innerHTML = about.bio.replace(/\n/g, '<br>');
    }
  </script>
