<!--- projects.html -->

<div class="content-section" id="projects">
    <h2>Research Projects</h2>

    <div class="projects-container">
    </div>

    <script>
      // read yaml files from projects.yml using js-yaml cdn library
      fetch('./data/projects.yml')
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.text();
              })
              .then(data => {
                  const yml = jsyaml.load(data);
                  console.log('Loaded projects:', yml.projects);
                  if (yml.projects && yml.projects.length > 0) {
                      yml.projects.forEach(renderProject);
                  } else {
                      document.querySelector('.projects-container').innerHTML = '<p>No projects found.</p>';
                  }
              })
              .catch(error => {
                  console.error('Error loading projects:', error);
                  document.querySelector('.projects-container').innerHTML = '<p>Error loading projects. Please check the console for details.</p>';
              });

      function renderProject(project, idx) {
      const tags = project.tags ? `<div class="project-tags">${project.tags.map(tag => `<span class="tag">${tag}</span>`).join(' ')}</div>` : '';
      const links = project.links ? `<div class="project-links">${Object.entries(project.links).map(([key, url]) => `<a href="${url}" target="_blank">${key}</a>`).join(' | ')}</div>` : '';
      const duration = project.duration ? `<div class="item-duration">${project.duration}</div>` : '';
      
      document.querySelector('.projects-container')
          .innerHTML +=
          `<div class="project-item">
              <div class="item-title">${project.title}</div>
              ${duration}
              <div class="item-description">${project.description}</div>
              ${tags}
              ${links}
          </div>`;
      }

    </script>
