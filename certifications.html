<div class="content-section" id="certifications">
    <h2>Certifications</h2>

    <div class="certifications-container">
    </div>

    <script>
      fetch('./data/cert.yml')
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.text();
              })
              .then(data => {
                  const yml = jsyaml.load(data);
                  console.log('Loaded certifications:', yml.certifications);
                  if (yml.certifications && yml.certifications.length > 0) {
                      yml.certifications.forEach(renderCert);
                  } else {
                      document.querySelector('.certifications-container').innerHTML = '<p>No certifications found.</p>';
                  }
              })
              .catch(error => {
                  console.error('Error loading certifications:', error);
                  document.querySelector('.certifications-container').innerHTML = '<p>Error loading certifications. Please check the console for details.</p>';
              });

      function renderCert(cert, idx) {
        const link = cert.url ? `<div class="cert-link"><a href="${cert.url}" target="_blank">View Certificate</a></div>` : '';
        
        document.querySelector('.certifications-container')
            .innerHTML +=
            `<div class="cert-item">
              <div class="item-title">${cert.title}</div>
              <div class="item-institution">${cert.organization}</div>
              <div class="item-date">${cert.date}</div>
              <div class="item-description">${cert.description}</div>
              ${link}
            </div>`;
      }

    </script>
  </div>
