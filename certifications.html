<div class="container" id="certifications">
    <h3>Certifications</h3>

    <ul class="cert-list">
    </ul>

    <script>
      fetch('./data/cert.yml')
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.text();
              })
              .then(data => {
                  const yml = jsyaml.load(data);
                  console.log('Loaded certifications:', yml.certifications);
                  if (yml.certifications && yml.certifications.length > 0) {
                      yml.certifications.forEach(renderCert);
                  } else {
                      document.querySelector('.cert-list').innerHTML = '<li>No certifications found.</li>';
                  }
              })
              .catch(error => {
                  console.error('Error loading certifications:', error);
                  document.querySelector('.cert-list').innerHTML = '<li>Error loading certifications. Please check the console for details.</li>';
              });

      function renderCert(cert, idx) {
        document.querySelector('.cert-list')
            .innerHTML +=
            `<li class="mb-4">
              <div class="col-lg-12">
                <h5><strong>${cert.title}</strong></h5>
                <strong>Organization:</strong> ${cert.organization}<br>
                <strong>Date:</strong> ${cert.date}<br>
                ${cert.description}
              </div>
            </li>`;
      }

    </script>
  </div>
